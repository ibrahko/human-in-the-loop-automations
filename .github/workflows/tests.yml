name: tests

on:
  push:
  pull_request:

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install n8n
        run: npm install -g n8n@2.40.7
      - name: Run the workflows against a throw-away n8n and mock services
        # Called through bash: the executable bit is lost when the repo is committed from Windows.
        run: bash tests/run_all.sh
